{% extends 'base.html' %}

{% block title %}Create Account | {{ store_name }}{% endblock %}

{% block content %}
<div class="container" style="padding-top: 4rem; padding-bottom: 6rem; max-width: 480px;">
  
  <div style="background: #FFFFFF; border: 1px solid var(--border-light); border-radius: var(--radius-xl); padding: 2.5rem; box-shadow: var(--shadow-md);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon-wrapper" style="margin: 0 auto 1rem auto; width: 48px; height: 48px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
          <path d="M12 18h.01"/>
        </svg>
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--navy-dark); margin-bottom: 0.35rem;">Create Your Account</h1>
      <p style="color: #64748B; font-size: 0.875rem;">Fast express checkouts and warranty tracking.</p>
    </div>

    <form action="{{ url_for('auth.register') }}" method="POST">
      
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.4rem;">Full Name *</label>
        <input type="text" name="name" required value="{{ name or '' }}" placeholder="e.g. Danish Malik" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border-light); border-radius: 8px; font-size: 0.9rem; outline: none;">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.4rem;">Email Address *</label>
        <input type="email" name="email" required value="{{ email or '' }}" placeholder="name@example.in" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border-light); border-radius: 8px; font-size: 0.9rem; outline: none;">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.4rem;">Mobile Number (+91) *</label>
        <input type="tel" name="phone" required value="{{ phone or '' }}" placeholder="10-digit mobile number" maxlength="13" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border-light); border-radius: 8px; font-size: 0.9rem; outline: none;">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.4rem;">Password (Min 6 characters) *</label>
        <input type="password" name="password" required placeholder="••••••••" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border-light); border-radius: 8px; font-size: 0.9rem; outline: none;">
      </div>

      <div style="margin-bottom: 1.75rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.4rem;">Confirm Password *</label>
        <input type="password" name="confirm_password" required placeholder="••••••••" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border-light); border-radius: 8px; font-size: 0.9rem; outline: none;">
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 0.95rem; margin-bottom: 1.5rem;">
        Register Account
      </button>

      <div style="text-align: center; font-size: 0.85rem; color: #64748B;">
        Already registered? 
        <a href="{{ url_for('auth.login') }}" style="color: var(--electric-blue); font-weight: 600;">Sign In</a>
      </div>

    </form>
  </div>

</div>
{% endblock %}
