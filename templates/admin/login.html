<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrator Login | HIGH TECH MOBILE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background: radial-gradient(circle at center, #0A1C36 0%, #06152B 70%, #040D1A 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .admin-card {
      background: #FFFFFF;
      border: 1px solid rgba(22, 119, 255, 0.3);
      border-radius: var(--radius-xl);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div class="admin-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon-wrapper" style="margin: 0 auto 1.25rem auto; width: 56px; height: 56px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
          <path d="M12 18h.01"/>
        </svg>
      </div>
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--navy-dark); margin-bottom: 0.35rem;">Admin Management Portal</h1>
      <p style="color: #64748B; font-size: 0.85rem;">Authorized Administrators: <strong>Avid Malik & Danish Malik</strong></p>
    </div>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}" style="margin-bottom: 1.25rem;">
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('auth.admin_login') }}" method="POST">
      
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.4rem;">Administrator Email *</label>
        <input type="email" name="email" required value="avidmalikhts@gmail.com" placeholder="avidmalikhts@gmail.com" style="width: 100%; padding: 0.7rem 0.85rem; border: 1px solid var(--border-light); border-radius: 8px; font-size: 0.9rem; outline: none;">
      </div>

      <div style="margin-bottom: 1.75rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.4rem;">Secure Password *</label>
        <input type="password" name="password" required placeholder="••••••••••••" style="width: 100%; padding: 0.7rem 0.85rem; border: 1px solid var(--border-light); border-radius: 8px; font-size: 0.9rem; outline: none;">
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 0.8rem; font-size: 1rem; border-radius: 8px;">
        Authenticate Securely &rarr;
      </button>

      <div style="margin-top: 1.5rem; text-align: center;">
        <a href="{{ url_for('store.home') }}" style="font-size: 0.85rem; color: #64748B;">&larr; Return to Customer Storefront</a>
      </div>

    </form>
  </div>

</body>
</html>
