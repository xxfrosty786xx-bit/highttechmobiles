{% extends 'base.html' %}

{% block title %}Page Not Found (404) | {{ store_name }}{% endblock %}

{% block content %}
<div class="container" style="padding-top: 5rem; padding-bottom: 7rem; text-align: center; max-width: 600px;">
  <div style="font-size: 5rem; font-weight: 800; color: var(--electric-blue); line-height: 1; margin-bottom: 1rem;">404</div>
  <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--navy-dark); margin-bottom: 0.75rem;">Page Not Found</h1>
  <p style="color: #64748B; font-size: 1rem; margin-bottom: 2rem;">The smartphone model, page, or link you are looking for may have moved or is no longer available.</p>
  <a href="{{ url_for('store.home') }}" class="btn-primary" style="padding: 0.75rem 2rem;">Return to Homepage</a>
</div>
{% endblock %}
